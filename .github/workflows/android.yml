      - name: 8. Injetar Código Nativo (Notificação Flutuante e Comparação Inteligente)
        run: |
          JAVA_DIR="android/app/src/main/java/com/control/door/portaria"
          mkdir -p "$JAVA_DIR"
          
          # MainActivity.java
          cat << 'EOF' > "$JAVA_DIR/MainActivity.java"
          package com.control.door.portaria;

          import android.Manifest;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.os.Build;
          import android.os.Bundle;
          import androidx.core.app.ActivityCompat;
          import com.getcapacitor.BridgeActivity;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  registerPlugin(PortariaPlugin.class);
                  solicitarPermissoesAgressivas();
                  iniciarServicoBackground();
              }

              private void solicitarPermissoesAgressivas() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      String[] permissoes = {
                          Manifest.permission.READ_PHONE_STATE,
                          Manifest.permission.READ_CALL_LOG,
                          Manifest.permission.POST_NOTIFICATIONS
                      };
                      ActivityCompat.requestPermissions(this, permissoes, 101);
                  }
              }

              private void iniciarServicoBackground() {
                  Intent serviceIntent = new Intent(this, CallService.class);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      startForegroundService(serviceIntent);
                  } else {
                      startService(serviceIntent);
                  }
              }
          }

          @CapacitorPlugin(name = "PortariaPlugin")
          class PortariaPlugin extends Plugin {
              @PluginMethod
              public void salvarNumero(PluginCall call) {
                  String numero = call.getString("numero");
                  SharedPreferences prefs = getContext().getSharedPreferences("PortariaPrefs", Context.MODE_PRIVATE);
                  prefs.edit().putString("numeroAlvo", numero).apply();
                  call.resolve();
              }

              @PluginMethod
              public void testarAlerta(PluginCall call) {
                  Intent intent = new Intent(getContext(), CallService.class);
                  intent.setAction("TEST_ALERT");
                  getContext().startService(intent);
                  call.resolve();
              }
          }
          EOF

          # CallService.java com Notificação Heads-up (Flutuante de Alta Prioridade e Canal Atualizado)
          cat << 'EOF' > "$JAVA_DIR/CallService.java"
          package com.control.door.portaria;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.content.SharedPreferences;
          import android.os.Build;
          import android.os.IBinder;
          import android.telephony.TelephonyManager;
          import android.util.Log;
          import androidx.core.app.NotificationCompat;

          public class CallService extends Service {
              private static final String TAG = "CallServiceDebug";
              private static final String CHANNEL_ID = "portaria_service_channel";
              private BroadcastReceiver callReceiver;

              @Override
              public void onCreate() {
                  super.onCreate();
                  startForegroundServiceCustom();
                  registerCallReceiver();
              }

              private void startForegroundServiceCustom() {
                  NotificationManager manager = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel channel = new NotificationChannel(CHANNEL_ID, "Serviço Ativo da Portaria", NotificationManager.IMPORTANCE_LOW);
                      manager.createNotificationChannel(channel);
                  }

                  Intent notificationIntent = new Intent(this, MainActivity.class);
                  PendingIntent pendingIntent = PendingIntent.getActivity(this, 0, notificationIntent, PendingIntent.FLAG_IMMUTABLE);

                  Notification notification = new NotificationCompat.Builder(this, CHANNEL_ID)
                          .setContentTitle("Portaria Protegida")
                          .setContentText("Monitorando chamadas em segundo plano...")
                          .setSmallIcon(android.R.drawable.ic_menu_camera)
                          .setContentIntent(pendingIntent)
                          .build();

                  startForeground(1337, notification);
              }

              private void registerCallReceiver() {
                  callReceiver = new BroadcastReceiver() {
                      @Override
                      public void onReceive(Context context, Intent intent) {
                          try {
                              String action = intent.getAction();
                              if (TelephonyManager.ACTION_PHONE_STATE_CHANGED.equals(action)) {
                                  String state = intent.getStringExtra(TelephonyManager.EXTRA_STATE);
                                  if (TelephonyManager.EXTRA_STATE_RINGING.equals(state)) {
                                      String incomingNumber = intent.getStringExtra(TelephonyManager.EXTRA_INCOMING_NUMBER);
                                      if (incomingNumber == null) incomingNumber = "";

                                      String cleanIncoming = incomingNumber.replaceAll("\\D", "");

                                      SharedPreferences prefs = context.getSharedPreferences("PortariaPrefs", Context.MODE_PRIVATE);
                                      String targetNumber = prefs.getString("numeroAlvo", "");
                                      String cleanTarget = targetNumber.replaceAll("\\D", "");

                                      Log.d(TAG, "Chamada recebida: " + cleanIncoming + " | Alvo: " + cleanTarget);

                                      if (!cleanTarget.isEmpty() && !cleanIncoming.isEmpty()) {
                                          boolean matchExato = cleanIncoming.contains(cleanTarget) || cleanTarget.contains(cleanIncoming);
                                          
                                          String subIncoming = cleanIncoming.length() >= 8 ? cleanIncoming.substring(cleanIncoming.length() - 8) : cleanIncoming;
                                          String subTarget = cleanTarget.length() >= 8 ? cleanTarget.substring(cleanTarget.length() - 8) : cleanTarget;
                                          boolean matchParcial = subIncoming.equals(subTarget);

                                          if (matchExato || matchParcial) {
                                              Log.d(TAG, "SUCESSO! Chamada da portaria identificada.");
                                              triggerAlertNotification(context);
                                          }
                                      }
                                  }
                              }
                          } catch (Exception e) {
                              Log.e(TAG, "Erro no BroadcastReceiver", e);
                          }
                      }
                  };

                  IntentFilter filter = new IntentFilter();
                  filter.addAction(TelephonyManager.ACTION_PHONE_STATE_CHANGED);
                  registerReceiver(callReceiver, filter);
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if (intent != null && "TEST_ALERT".equals(intent.getAction())) {
                      triggerAlertNotification(this);
                  }
                  return START_STICKY;
              }

              private void triggerAlertNotification(Context context) {
                  NotificationManager manager = (NotificationManager) context.getSystemService(Context.NOTIFICATION_SERVICE);
                  String alertChannelId = "portaria_alert_channel_v2";

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel channel = new NotificationChannel(
                          alertChannelId, 
                          "Alerta Urgente da Portaria", 
                          NotificationManager.IMPORTANCE_HIGH
                      );
                      channel.enableVibration(true);
                      manager.createNotificationChannel(channel);
                  }

                  Intent intent = context.getPackageManager().getLaunchIntentForPackage(context.getPackageName());
                  if (intent != null) {
                      intent.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  }
                  PendingIntent pendingIntent = PendingIntent.getActivity(context, 0, intent, PendingIntent.FLAG_IMMUTABLE);

                  NotificationCompat.Builder builder = new NotificationCompat.Builder(context, alertChannelId)
                          .setSmallIcon(android.R.drawable.ic_menu_camera)
                          .setContentTitle("🚨 CHAMADA DA PORTARIA!")
                          .setContentText("Toque para ver a câmera ao vivo.")
                          .setPriority(NotificationCompat.PRIORITY_HIGH)
                          .setCategory(NotificationCompat.CATEGORY_CALL)
                          .setAutoCancel(true)
                          .setDefaults(NotificationCompat.DEFAULT_ALL)
                          .setContentIntent(pendingIntent)
                          .setVisibility(NotificationCompat.VISIBILITY_PUBLIC);

                  manager.notify(9999, builder.build());
                  Log.d(TAG, "Notificação flutuante forçada disparada com sucesso!");
              }

              @Override
              public IBinder onBind(Intent intent) { return null; }

              @Override
              public void onDestroy() {
                  if (callReceiver != null) { unregisterReceiver(callReceiver); }
                  super.onDestroy();
              }
          }
          EOF

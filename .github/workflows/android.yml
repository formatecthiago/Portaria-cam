name: Build Android APK MVP

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout do Repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 3. Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 4. Instalar Dependencias
        run: |
          npm install

      - name: 5. Estruturar Pasta Web
        run: |
          mkdir -p www
          cp -r index.html package.json capacitor.config.json www/ 2>/dev/null || true

      - name: 6. Sincronizar Android
        run: |
          npx cap add android || echo "Ja existe"
          npx cap sync android

      - name: 7. Copiar Arquivos Nativos e Animação
        run: |
          JAVA_DIR="android/app/src/main/java/com/control/door/portaria"
          mkdir -p "$JAVA_DIR"
          [ -f "CallService.java" ] && cp CallService.java "$JAVA_DIR/CallService.java"
          [ -f "MainActivity.java" ] && cp MainActivity.java "$JAVA_DIR/MainActivity.java"

          RES_DIR="android/app/src/main/res"
          mkdir -p "$RES_DIR/drawable"
          [ -f "police_flashing_dot.xml" ] && cp police_flashing_dot.xml "$RES_DIR/drawable/police_flashing_dot.xml"

      - name: 8. Injetar Permissoes e Servico no AndroidManifest.xml
        run: |
          MANIFEST_PATH=$(find android -name AndroidManifest.xml | head -n 1)
          if [ -f "$MANIFEST_PATH" ]; then
            sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.READ_PHONE_STATE" />\n    <uses-permission android:name="android.permission.READ_CALL_LOG" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_PHONE_CALL" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' "$MANIFEST_PATH"
            sed -i '/<\/application>/i \        <service android:name="com.control.door.portaria.CallService" android:enabled="true" android:exported="false" android:foregroundServiceType="phoneCall" \/>' "$MANIFEST_PATH"
          fi

      - name: 9. Gerar APK Debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 10. Salvar Artefato APK
        uses: actions/upload-artifact@v4
        with:
          name: Portaria-MVP-APK
          path: "**/app-debug.apk"

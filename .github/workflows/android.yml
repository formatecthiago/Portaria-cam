name: Build Android APK (Portaria)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout do Repositório
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 3. Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 4. Instalar Dependências
        run: |
          npm install

      - name: 5. Estruturar Pasta Web (www)
        run: |
          mkdir -p www
          cp -r index.html bridge.js manifest.json icon.svg www/ 2>/dev/null || true

      - name: 6. Adicionar e Sincronizar Plataforma Android
        run: |
          npx cap add android || echo "Plataforma android ja existe"
          npx cap sync android

      - name: 7. Injetar o Serviço Nativo Agressivo (CallService.java)
        run: |
          JAVA_DIR="android/app/src/main/java/com/control/door/portaria"
          mkdir -p "$JAVA_DIR"
          
          cat << 'EOF' > "$JAVA_DIR/CallService.java"
          package com.control.door.portaria;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.os.Build;
          import android.os.IBinder;
          import android.telephony.TelephonyManager;
          import android.util.Log;
          import androidx.core.app.NotificationCompat;

          public class CallService extends Service {
              private static final String TAG = "CallServiceDebug";
              private static final String CHANNEL_ID = "portaria_service_channel";
              private BroadcastReceiver callReceiver;

              @Override
              public void onCreate() {
                  super.onCreate();
                  startForegroundServiceCustom();
                  registerCallReceiver();
              }

              private void startForegroundServiceCustom() {
                  NotificationManager manager = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel channel = new NotificationChannel(CHANNEL_ID, "Serviço Ativo da Portaria", NotificationManager.IMPORTANCE_LOW);
                      manager.createNotificationChannel(channel);
                  }

                  Intent notificationIntent = new Intent(this, MainActivity.class);
                  PendingIntent pendingIntent = PendingIntent.getActivity(this, 0, notificationIntent, PendingIntent.FLAG_IMMUTABLE);

                  Notification notification = new NotificationCompat.Builder(this, CHANNEL_ID)
                          .setContentTitle("Portaria Protegida")
                          .setContentText("Monitorando chamadas em segundo plano...")
                          .setSmallIcon(android.R.drawable.ic_menu_camera)
                          .setContentIntent(pendingIntent)
                          .build();

                  startForeground(1337, notification);
              }

              private void registerCallReceiver() {
                  callReceiver = new BroadcastReceiver() {
                      @Override
                      public void onReceive(Context context, Intent intent) {
                          try {
                              String state = intent.getStringExtra(TelephonyManager.EXTRA_STATE);
                              if (TelephonyManager.EXTRA_STATE_RINGING.equals(state)) {
                                  String incomingNumber = intent.getStringExtra(TelephonyManager.EXTRA_INCOMING_NUMBER);
                                  Log.d(TAG, "Chamada detectada! Número: " + incomingNumber);

                                  triggerAlertNotification(context, incomingNumber);
                              }
                          } catch (Exception e) {
                              Log.e(TAG, "Erro ao interceptar chamada", e);
                          }
                      }
                  };

                  IntentFilter filter = new IntentFilter(TelephonyManager.ACTION_PHONE_STATE_CHANGED);
                  registerReceiver(callReceiver, filter);
              }

              private void triggerAlertNotification(Context context, String number) {
                  NotificationManager manager = (NotificationManager) context.getSystemService(Context.NOTIFICATION_SERVICE);
                  String alertChannelId = "portaria_alert_channel";

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel channel = new NotificationChannel(alertChannelId, "Alerta Urgente de Chamada", NotificationManager.IMPORTANCE_HIGH);
                      channel.setBypassDnd(true);
                      manager.createNotificationChannel(channel);
                  }

                  Intent intent = context.getPackageManager().getLaunchIntentForPackage(context.getPackageName());
                  if (intent != null) {
                      intent.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  }
                  PendingIntent pendingIntent = PendingIntent.getActivity(context, 0, intent, PendingIntent.FLAG_IMMUTABLE);

                  NotificationCompat.Builder builder = new NotificationCompat.Builder(context, alertChannelId)
                          .setSmallIcon(android.R.drawable.ic_lock_idle_alarm)
                          .setContentTitle("🚨 CHAMADA DA PORTARIA!")
                          .setContentText("Toque imediatamente para abrir o vídeo ao vivo.")
                          .setPriority(NotificationCompat.PRIORITY_MAX)
                          .setCategory(NotificationCompat.CATEGORY_CALL)
                          .setAutoCancel(true)
                          .setFullScreenIntent(pendingIntent, true)
                          .setContentIntent(pendingIntent);

                  manager.notify(9999, builder.build());
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  return START_STICKY;
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }

              @Override
              public void onDestroy() {
                  if (callReceiver != null) {
                      unregisterReceiver(callReceiver);
                  }
                  super.onDestroy();
              }
          }
          EOF

      - name: 8. Configurar Permissões e o Serviço no AndroidManifest.xml
        run: |
          MANIFEST_PATH=$(find android -name AndroidManifest.xml | head -n 1)
          if [ -f "$MANIFEST_PATH" ]; then
            # Adiciona todas as permissões agressivas necessárias
            sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.READ_PHONE_STATE" />\n    <uses-permission android:name="android.permission.READ_CALL_LOG" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_PHONE_CALL" />\n    <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />' "$MANIFEST_PATH"
            
            # Adiciona o serviço em primeiro plano dentro da tag application
            sed -i '/<\/application>/i \    <service android:name=".CallService" android:exported="false" android:foregroundServiceType="phoneCall" />' "$MANIFEST_PATH"
          fi

      - name: 9. Copiar Google Services para o Android Nativo
        run: |
          mkdir -p android/app
          cp google-services.json android/app/ 2>/dev/null || true

      - name: 10. Gerar APK Debug
        run: |
          GRADLEW_PATH=$(find android -name gradlew)
          GRADLE_DIR=$(dirname "$GRADLEW_PATH")
          cd "$GRADLE_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 11. Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: Portaria-APK
          path: "**/app-debug.apk"

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#121212">
    <title>Portaria</title>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #121212;
            color: #00ffcc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 400px;
            background: #1e1e1e;
            border-radius: 12px;
            padding: 25px 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            border: 1px solid #333;
        }

        h2 {
            font-size: 1.3rem;
            margin-bottom: 20px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #00ffcc;
        }

        label {
            font-size: 0.8rem;
            color: #aaa;
            text-transform: uppercase;
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            background: #121212;
            border: 1px solid #444;
            color: #fff;
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
        }

        input:focus {
            border-color: #00ffcc;
            outline: none;
        }

        .btn-principal {
            width: 100%;
            padding: 14px;
            background: #00ff00;
            color: #121212;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 4px 12px rgba(0,255,0,0.3);
        }

        .btn-principal:active { transform: scale(0.98); }

        /* Tela 2: Visualização da Portaria */
        #telaPortaria { display: none; width: 100%; max-width: 400px; display: flex; flex-direction: column; align-items: center; }
        
        .info-casa {
            font-size: 1.1rem;
            font-weight: bold;
            color: #00ffcc;
            margin-bottom: 12px;
            text-align: center;
            text-transform: uppercase;
        }

        .video-wrapper {
            width: 100%;
            height: 240px;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #444;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #frameImg {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .status-bar {
            margin-top: 12px;
            font-size: 0.85rem;
            color: #aaa;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }

        /* Cores de status rigorosas: Amarelo para aguardando/repouso, Verde para online */
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #eccc68;
            box-shadow: 0 0 8px #eccc68;
        }
        .status-dot.online { background-color: #00ff00; box-shadow: 0 0 8px #00ff00; }

        .btn-redefinir {
            margin-top: 20px;
            background: none;
            border: none;
            color: #ff4757;
            font-size: 0.8rem;
            cursor: pointer;
            text-decoration: underline;
        }
    </style>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>

    <!-- TELA 1: CADASTRO INICIAL -->
    <div id="telaCadastro" class="card">
        <h2>Configuração da Portaria</h2>
        
        <label for="inputCasa">Número da Casa:</label>
        <input type="text" id="inputCasa" placeholder="Ex: Casa 08">

        <label for="inputTelefone">Número de Telefone Alvo:</label>
        <input type="tel" id="inputTelefone" placeholder="Ex: 084988040811">

        <button class="btn-principal" onclick="salvarCadastro()">Salvar e Entrar</button>
    </div>

    <!-- TELA 2: PORTARIA AO VIVO (LIMPA E DIRETA) -->
    <div id="telaPortaria" style="display: none;">
        <div class="info-casa" id="txtIdentificacaoCasa">Casa 08 — Ouvindo Portaria</div>

        <div class="video-wrapper">
            <img id="frameImg" src="" alt="Aguardando sinal da câmera...">
        </div>

        <div class="status-bar">
            <div id="statusDot" class="status-dot"></div>
            <span id="statusTxt" style="color: #eccc68;">Aguardando sinal da câmera...</span>
        </div>

        <button class="btn-redefinir" onclick="redefinirConfiguracao()">⚙️ Redefinir Configurações</button>
    </div>

    <script>
        // URL CORRETA E UNIFICADA DO FIREBASE (Mesma do painel Admin e do seu print)
        const firebaseConfig = {
            apiKey: "AIzaSyCyOvvGYTCe6EBb8BC20-oHW6ClWYJZFiM",
            databaseURL: "https://portaria-cam-default-rtdb.firebaseio.com"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const database = firebase.database();

        window.addEventListener('DOMContentLoaded', () => {
            verificarEstadoInicial();
        });

        function verificarEstadoInicial() {
            const casaSalva = localStorage.getItem('numeroCasaAlvo');
            const telSalvo = localStorage.getItem('numeroPortariaAlvo');

            if (casaSalva && telSalvo) {
                document.getElementById('telaCadastro').style.display = 'none';
                document.getElementById('telaPortaria').style.display = 'flex';
                document.getElementById('txtIdentificacaoCasa').textContent = `${casaSalva} — Ouvindo Portaria`;
                
                iniciarEscutaFirebase();
            } else {
                document.getElementById('telaCadastro').style.display = 'block';
                document.getElementById('telaPortaria').style.display = 'none';
            }
        }

        function salvarCadastro() {
            const casa = document.getElementById('inputCasa').value.trim();
            const telefone = document.getElementById('inputTelefone').value.trim();

            if (!casa || !telefone) {
                alert("Por favor, preencha o número da casa e o telefone alvo.");
                return;
            }

            localStorage.setItem('numeroCasaAlvo', casa);
            localStorage.setItem('numeroPortariaAlvo', telefone);

            try {
                if (window.AndroidBridge && typeof window.AndroidBridge.salvarNumeroNativo === 'function') {
                    window.AndroidBridge.salvarNumeroNativo(telefone);
                }
            } catch (e) {
                console.log("Bridge nativa não disponível.");
            }

            verificarEstadoInicial();
        }

        function redefinirConfiguracao() {
            if (confirm("Deseja realmente redefinir as configurações? Você precisará cadastrar novamente.")) {
                localStorage.removeItem('numeroCasaAlvo');
                localStorage.removeItem('numeroPortariaAlvo');
                window.location.reload();
            }
        }

        // Lógica de Streaming original escutando o nó 'camera/stream'
        function iniciarEscutaFirebase() {
            const frameImg = document.getElementById('frameImg');
            const statusTxt = document.getElementById('statusTxt');
            const statusDot = document.getElementById('statusDot');

            database.ref('camera/stream').on('value', (snapshot) => {
                const data = snapshot.val();
                if (data && data.imagem) {
                    frameImg.src = data.imagem;
                    statusTxt.textContent = "Transmissão Ativa (Ao Vivo)";
                    statusTxt.style.color = "#00ff00";
                    statusDot.className = "status-dot online";
                } else {
                    statusTxt.textContent = "Aguardando sinal da câmera...";
                    statusTxt.style.color = "#eccc68";
                    statusDot.className = "status-dot";
                }
            }, (error) => {
                statusTxt.textContent = "Erro ao conectar ao stream";
                statusTxt.style.color = "#ff4757";
                statusDot.className = "status-dot";
            });
        }

        // GATILHO AUTOMÁTICO: Registra o histórico no banco unificado para o Admin
        function registrarVisitaHistorico(numeroChegando) {
            const casaAlvo = localStorage.getItem('numeroCasaAlvo') || "Desconhecida";
            const agora = new Date();
            const frameImg = document.getElementById('frameImg');
            const imagemAtual = frameImg ? frameImg.src : "";

            const dadosVisita = {
                casa: casaAlvo,
                numeroTelefone: numeroChegando,
                data: agora.toLocaleDateString('pt-BR'),
                hora: agora.toLocaleTimeString('pt-BR'),
                miniatura: imagemAtual || "",
                timestamp: Date.now()
            };

            database.ref('historico_chamadas').push(dadosVisita)
                .then(() => {
                    console.log("Visita registrada com sucesso no Firebase para o Admin!");
                })
                .catch((err) => console.error("Erro ao registrar no histórico:", err));
        }

        window.addEventListener('portariaChamando', (e) => {
            const numDetectado = (e.detail && e.detail.numero) ? e.detail.numero : (localStorage.getItem('numeroPortariaAlvo') || "Chamada");
            registrarVisitaHistorico(numDetectado);
        });

        function onChamadaDetectadaDoNativo(numeroReal) {
            const evento = new CustomEvent('portariaChamando', { detail: { numero: numeroReal } });
            window.dispatchEvent(evento);
        }
    </script>
</body>
</html>

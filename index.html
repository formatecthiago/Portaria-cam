<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a1a1a">
    <title>Portaria ao vivo</title>

    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 15px;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 420px;
            background: #1e1e1e;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .btn-close-top {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #ff4757;
            color: #ffffff;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(255, 71, 87, 0.4);
        }

        .btn-close-top:active { transform: scale(0.95); }

        h2 {
            font-size: 1.1rem;
            margin-top: 10px;
            margin-bottom: 15px;
            color: #e0e0e0;
            text-transform: uppercase;
            letter-spacing: 1px;
            width: 100%;
            text-align: left;
        }

        .config-box {
            width: 100%;
            background: #2a2a2a;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border: 1px solid #3d3d3d;
        }

        .config-box label {
            font-size: 0.75rem;
            color: #00ff88;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: bold;
        }

        .config-row {
            display: flex;
            gap: 8px;
        }

        .config-row input {
            flex: 1;
            background: #121212;
            border: 1px solid #444;
            color: #fff;
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        .config-row button {
            background: #00b894;
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .config-row button:active { transform: scale(0.95); }

        .btn-test {
            width: 100%;
            background: #007bff;
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,123,255,0.3);
        }
        .btn-test:active { transform: scale(0.98); }

        .video-wrapper {
            position: relative;
            width: 100%;
            height: 220px;
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #frameImg {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .status-bar {
            margin: 15px 0 5px 0;
            font-size: 0.85rem;
            color: #aaa;
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #ff4757;
        }

        .status-dot.online { background-color: #00ff88; box-shadow: 0 0 8px #00ff88; }
        .status-dot.repouso { background-color: #eccc68; box-shadow: 0 0 8px #eccc68; }
    </style>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="bridge.js"></script>
</head>
<body>

    <div class="container">
        <button class="btn-close-top" onclick="fecharTudo()">
            ✖ Sair
        </button>

        <h2>Portaria ao vivo</h2>

        <div class="config-box">
            <label>Número da Portaria (Alvo):</label>
            <div class="config-row">
                <input type="tel" id="inputNumero" placeholder="Ex: 84988509817">
                <button onclick="salvarNumeroPortaria()">Salvar</button>
            </div>
        </div>

        <button class="btn-test" onclick="testarAlertaManual()">
            🧪 Testar Notificação de Chamada Agora
        </button>

        <div class="video-wrapper">
            <img id="frameImg" src="https://picsum.photos/400/225" alt="Aguardando sinal...">
        </div>

        <div class="status-bar">
            <div id="statusDot" class="status-dot"></div>
            <span id="statusTxt">Aguardando chamada...</span>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const numeroSalvo = localStorage.getItem('numeroPortariaAlvo') || "";
            if (numeroSalvo) {
                document.getElementById('inputNumero').value = numeroSalvo;
            }
        });

        function salvarNumeroPortaria() {
            const novoNumero = document.getElementById('inputNumero').value.trim();
            if (!novoNumero) {
                alert("Por favor, digite o número da portaria.");
                return;
            }
            
            localStorage.setItem('numeroPortariaAlvo', novoNumero);

            if (window.PortariaBridge && typeof window.PortariaBridge.salvarNumero === 'function') {
                window.PortariaBridge.salvarNumero(novoNumero);
            }

            alert("Número salvo com sucesso!");
        }

        function testarAlertaManual() {
            if (window.PortariaBridge && typeof window.PortariaBridge.testarAlerta === 'function') {
                window.PortariaBridge.testarAlerta();
            } else {
                alert("Simulação web: O teste nativo funcionará no APK gerado.");
            }
        }

        const firebaseConfig = {
            apiKey: "AIzaSyCyOvvGYTCe6EBb8BC20-oHW6ClWYJZFiM",
            databaseURL: "https://virty-access-door-default-rtdb.firebaseio.com"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const database = firebase.database();

        const frameImg = document.getElementById('frameImg');
        const statusTxt = document.getElementById('statusTxt');
        const statusDot = document.getElementById('statusDot');

        let timerRepouso = null;

        database.ref('camera/stream').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data && data.imagem) {
                frameImg.src = data.imagem;
                statusTxt.textContent = "Portaria: Transmissão Ativa (Ao Vivo)";
                statusDot.className = "status-dot online";

                clearTimeout(timerRepouso);
                timerRepouso = setTimeout(() => {
                    marcarComoInativo();
                }, 2000);
            } else {
                marcarComoInativo();
            }
        });

        function marcarComoInativo() {
            statusTxt.textContent = "Portaria: Sem sinal / Repouso";
            statusDot.className = "status-dot repouso";
        }

        function fecharTudo() {
            window.location.href = "https://www.google.com";
        }
    </script>
</body>
</html>

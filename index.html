<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a1a1a">
    <title>Portaria ao vivo - Debug Log</title>

    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 10px;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 420px;
            background: #1e1e1e;
            border-radius: 16px;
            padding: 15px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .btn-close-top {
            position: absolute;
            top: 12px;
            right: 12px;
            background: #ff4757;
            color: #ffffff;
            border: none;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
        }

        h2 {
            font-size: 1rem;
            margin-top: 5px;
            margin-bottom: 10px;
            color: #e0e0e0;
            text-transform: uppercase;
            letter-spacing: 1px;
            width: 100%;
            text-align: left;
        }

        .config-box {
            width: 100%;
            background: #2a2a2a;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            border: 1px solid #3d3d3d;
        }

        .config-box label {
            font-size: 0.7rem;
            color: #00ff88;
            text-transform: uppercase;
            font-weight: bold;
        }

        .config-row {
            display: flex;
            gap: 6px;
        }

        .config-row input {
            flex: 1;
            background: #121212;
            border: 1px solid #444;
            color: #fff;
            padding: 6px 8px;
            border-radius: 6px;
            font-size: 0.85rem;
        }

        .config-row button {
            background: #00b894;
            color: #fff;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .btn-test {
            width: 100%;
            background: #007bff;
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.8rem;
            cursor: pointer;
            margin-bottom: 8px;
            box-shadow: 0 4px 10px rgba(0,123,255,0.3);
        }
        .btn-test:active { transform: scale(0.98); }

        .video-wrapper {
            position: relative;
            width: 100%;
            height: 150px;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
        }

        #frameImg {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .log-container {
            width: 100%;
            background: #0a0a0a;
            border: 1px solid #00ff88;
            border-radius: 8px;
            padding: 8px;
            margin-top: 5px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: #00ff88;
            font-weight: bold;
            border-bottom: 1px solid #222;
            padding-bottom: 4px;
        }

        .btn-copy-log {
            background: #333;
            color: #fff;
            border: none;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.65rem;
            cursor: pointer;
        }

        #logBox {
            width: 100%;
            height: 90px;
            background: #000;
            color: #00ff88;
            font-family: monospace;
            font-size: 0.65rem;
            padding: 5px;
            border-radius: 4px;
            overflow-y: auto;
            text-align: left;
            border: 1px solid #222;
            white-space: pre-wrap;
            word-break: break-all;
        }
    </style>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>

    <div class="container">
        <button class="btn-close-top" onclick="fecharTudo()">✖ Sair</button>

        <h2>Portaria ao vivo</h2>

        <div class="config-box">
            <label>Número da Portaria (Alvo):</label>
            <div class="config-row">
                <input type="tel" id="inputNumero" placeholder="Ex: 84988509817">
                <button onclick="salvarNumeroPortaria()">Salvar</button>
            </div>
        </div>

        <button class="btn-test" onclick="testarAlertaManual()">
            🧪 Testar Notificação de Chamada Agora
        </button>

        <div class="video-wrapper">
            <img id="frameImg" src="https://picsum.photos/400/225" alt="Aguardando sinal...">
        </div>

        <div class="log-container">
            <div class="log-header">
                <span>🖥️ LOG EM TEMPO REAL:</span>
                <button class="btn-copy-log" onclick="copiarLogs()">Copiar Logs</button>
            </div>
            <div id="logBox">Iniciando sistema de log...</div>
        </div>
    </div>

    <script>
        function logMsg(texto) {
            const box = document.getElementById('logBox');
            const horario = new Date().toLocaleTimeString();
            box.textContent += `[${horario}] ${texto}\n`;
            box.scrollTop = box.scrollHeight;
            console.log(`[LOG] ${texto}`);
        }

        function copiarLogs() {
            const box = document.getElementById('logBox');
            navigator.clipboard.writeText(box.textContent).then(() => {
                alert("Logs copiados para a área de transferência!");
            }).catch(err => {
                alert("Erro ao copiar logs: " + err);
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            logMsg("DOM carregado com sucesso.");
            const numeroSalvo = localStorage.getItem('numeroPortariaAlvo') || "";
            if (numeroSalvo) {
                document.getElementById('inputNumero').value = numeroSalvo;
                logMsg("Número recuperado do Storage: " + numeroSalvo);
            } else {
                logMsg("Nenhum número salvo anteriormente.");
            }
        });

        function salvarNumeroPortaria() {
            const novoNumero = document.getElementById('inputNumero').value.trim();
            if (!novoNumero) {
                logMsg("ERRO: Digite um número válido para salvar.");
                alert("Por favor, digite o número da portaria.");
                return;
            }
            
            localStorage.setItem('numeroPortariaAlvo', novoNumero);
            logMsg("Número salvo no localStorage: " + novoNumero);

            try {
                if (window.AndroidInterface && typeof window.AndroidInterface.salvarNumero === 'function') {
                    window.AndroidInterface.salvarNumero(novoNumero);
                    logMsg("Comando enviado ao nativo: salvarNumero.");
                } else {
                    logMsg("AVISO: window.AndroidInterface indisponível (Modo Web).");
                }
            } catch (e) {
                logMsg("ERRO ao chamar AndroidInterface.salvar: " + e.message);
            }

            alert("Número salvo com sucesso!");
        }

        function testarAlertaManual() {
            logMsg("Botão 'Testar Alerta' pressionado.");
            try {
                if (window.AndroidInterface && typeof window.AndroidInterface.testarAlerta === 'function') {
                    window.AndroidInterface.testarAlerta();
                    logMsg("Comando enviado ao nativo: testarAlerta com sucesso.");
                } else {
                    logMsg("FALHA: window.AndroidInterface.testarAlerta indisponível!");
                    alert("Simulação web: Interface nativa não detectada.");
                }
            } catch (e) {
                logMsg("EXCEÇÃO em testarAlertaManual: " + e.message);
                alert("Erro: " + e.message);
            }
        }

        // Firebase Stream
        const firebaseConfig = {
            apiKey: "AIzaSyCyOvvGYTCe6EBb8BC20-oHW6ClWYJZFiM",
            databaseURL: "https://virty-access-door-default-rtdb.firebaseio.com"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
            logMsg("Firebase inicializado com sucesso.");
        }
        const database = firebase.database();
        const frameImg = document.getElementById('frameImg');

        let timerRepouso = null;

        database.ref('camera/stream').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data && data.imagem) {
                frameImg.src = data.imagem;
                clearTimeout(timerRepouso);
                timerRepouso = setTimeout(() => {}, 2000);
            }
        });

        function fecharTudo() {
            logMsg("Fechando aplicativo...");
            window.location.href = "https://www.google.com";
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portaria - MVP Detecção</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            padding: 20px;
            margin: 0;
        }
        h2 { color: #00ffcc; text-align: center; }
        .card {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid #333;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 10px;
            background: #2d2d2d;
            border: 1px solid #555;
            color: #fff;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #00b0ff;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background: #0091ea; }
        #logBox {
            background: #000;
            color: #00ff00;
            font-family: monospace;
            padding: 10px;
            height: 200px;
            overflow-y: auto;
            border-radius: 4px;
            font-size: 12px;
            border: 1px solid #333;
        }
    </style>
</head>
<body>

    <h2>PORTARIA - MVP DETECÇÃO</h2>

    <div class="card">
        <label>Número Alvo da Chamada:</label>
        <input type="tel" id="inputNumero" placeholder="Ex: 84988509817">
        <button onclick="salvarNumero()">Salvar Número Alvo</button>
    </div>

    <div class="card">
        <label>Log de Atividade em Tempo Real:</label>
        <div id="logBox">Iniciando sistema...</div>
    </div>

<script>
    function log(mensagem) {
        const box = document.getElementById('logBox');
        const hora = new Date().toLocaleTimeString();
        box.innerHTML += `[${hora}] ${mensagem}<br>`;
        box.scrollTop = box.scrollHeight;
    }

    function salvarNumero() {
        const num = document.getElementById('inputNumero').value.trim();
        if(num) {
            localStorage.setItem('numeroAlvo', num);
            log(`Número salvo com sucesso: ${num}`);
            alert('Número salvo!');
        } else {
            alert('Digite um número válido.');
        }
    }

    window.onload = function() {
        log("App carregado em primeiro plano.");
        const salvo = localStorage.getItem('numeroAlvo');
        if(salvo) {
            document.getElementById('inputNumero').value = salvo;
            log(`Número recuperado do Storage: ${salvo}`);
        } else {
            log("Nenhum número salvo anteriormente.");
        }
    };

    // Função que será chamada pelo nativo Android quando a chamada chegar
    function onChamadaDetectada(numeroChegando) {
        log(`🚨 CHAMADA DETECTADA DO NÚMERO: ${numeroChegando}`);
        const alvoSalvo = localStorage.getItem('numeroAlvo') || '';
        
        if (alvoSalvo && numeroChegando.includes(alvoSalvo)) {
            log(`MATCH PERFEITO! O número ${numeroChegando} corresponde ao alvo.`);
            document.body.style.backgroundColor = '#004d40'; // Muda a tela para verde escuro para indicar sucesso visual imediato
        } else {
            log(`Chamada ignorada (Não bate com o alvo: ${alvoSalvo})`);
        }
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a1a1a">
    <title>Portaria ao vivo - Configuração</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: #1e1e1e;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        h2 { font-size: 1.2rem; text-align: center; color: #00ff88; text-transform: uppercase; letter-spacing: 1px; }
        p { font-size: 0.9rem; color: #ccc; text-align: center; line-height: 1.4; }
        .input-group { display: flex; flex-direction: column; gap: 8px; }
        .input-group label { font-size: 0.8rem; color: #aaa; text-transform: uppercase; }
        .input-group input {
            background: #121212;
            border: 1px solid #444;
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            text-align: center;
        }
        .btn {
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            color: #fff;
            background: #00b894;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0,184,148,0.3);
        }
        .btn:active { transform: scale(0.98); }
        .permission-box {
            background: #2a2a2a;
            padding: 12px;
            border-radius: 8px;
            border-left: 4px solid #ff4757;
            font-size: 0.85rem;
            color: #ff6b81;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Ativação da Portaria</h2>
        
        <div class="permission-box" id="permWarning">
            ⚠️ <b>Atenção:</b> Para que o app funcione com a tela bloqueada, você deve conceder todas as permissões solicitadas pelo sistema.
        </div>

        <div class="input-group">
            <label for="inputNumero">Número da Portaria (Exato que vai ligar):</label>
            <input type="tel" id="inputNumero" placeholder="Ex: 84988040811">
        </div>

        <button class="btn" onclick="salvarEAtivar()">CONCEDER PERMISSÕES E SALVAR</button>
        
        <p style="font-size: 0.75rem; color: #666;">O sistema manterá o serviço de escuta ativo em segundo plano.</p>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const numeroSalvo = localStorage.getItem('numeroPortariaAlvo') || "";
            if(numeroSalvo) document.getElementById('inputNumero').value = numeroSalvo;
        });

        function salvarEAtivar() {
            const numero = document.getElementById('inputNumero').value.trim();
            if (!numero) {
                alert("Digite o número da portaria!");
                return;
            }
            localStorage.setItem('numeroPortariaAlvo', numero);
            
            // Salva também no armazenamento local do Android se houver bridge, senão apenas avisa
            alert("Número salvo com sucesso! O sistema está pronto para monitorar as chamadas.");
            
            // Força pedido de permissões nativas se o capacitor estiver presente
            if (window.Capacitor && window.Capacitor.Plugins) {
                console.log("Solicitando permissões nativas...");
            }
        }
    </script>
</body>
</html>

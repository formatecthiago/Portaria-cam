      - name: Copiar Arquivos Nativos da Raiz para o Projeto Android
        run: |
          JAVA_DIR="android/app/src/main/java/com/control/door/portaria"
          mkdir -p "$JAVA_DIR"
          
          if [ -f "CallService.java" ]; then
            cp CallService.java "$JAVA_DIR/CallService.java"
            echo "CallService.java copiado."
          fi

          if [ -f "WebAppInterface.java" ]; then
            cp WebAppInterface.java "$JAVA_DIR/WebAppInterface.java"
            echo "WebAppInterface.java copiado."
          fi

          if [ -f "MainActivity.java" ]; then
            cp MainActivity.java "$JAVA_DIR/MainActivity.java"
            echo "MainActivity.java copiado."
          fi

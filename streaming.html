<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador de Câmera - Portaria Cam (4 FPS)</title>
  
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      background: #121212;
      color: #fff;
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
      margin: 0;
    }
    .card {
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 20px;
      max-width: 360px;
      margin: 0 auto;
    }
    video {
      width: 320px;
      height: 240px;
      border: 2px solid #00ff00;
      border-radius: 8px;
      background: #000;
      object-fit: cover;
    }
    .btn {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border-radius: 8px;
      border: none;
      background: #00ff00;
      color: #000;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      text-transform: uppercase;
    }
    .btn:active { transform: scale(0.98); }
    #status { font-weight: bold; color: #00ff00; margin-top: 15px; font-size: 0.9rem; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Simulador - Portaria Cam</h2>
    
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="canvas" width="320" height="240" style="display: none;"></canvas>
    
    <button id="btn-pip" class="btn" onclick="alternarModoFlutuante()">🔲 MODO FLUTUANTE (PIP)</button>

    <p id="status">Aguardando permissão da câmera...</p>
  </div>

  <script>
    // Firebase Oficial do Projeto Portaria-cam
    const configPortariaCam = { 
      apiKey: "AIzaSyCyOvvGYTCe6EBb8BC20-oHW6ClWYJZFiM", 
      databaseURL: "https://portaria-cam-default-rtdb.firebaseio.com" 
    };
    
    if (!firebase.apps.length) firebase.initializeApp(configPortariaCam);
    const dbPortaria = firebase.database();

    const video = document.getElementById('webcam');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const statusText = document.getElementById('status');
    const btnPip = document.getElementById('btn-pip');

    let intervalTransmissao = null;

    // Inicializa a câmera do dispositivo imediatamente
    navigator.mediaDevices.getUserMedia({ 
      video: { width: 320, height: 240, facingMode: "environment" }, 
      audio: false 
    })
    .then((stream) => {
      video.srcObject = stream;
      statusText.innerText = "Transmissão Contínua (4 FPS) Ativa!";
      
      // Inicia o envio constante de frames para o Firebase sem nenhuma condição
      if (intervalTransmissao) clearInterval(intervalTransmissao);
      intervalTransmissao = setInterval(capturarEEnviar, 250);
    })
    .catch((err) => {
      statusText.innerText = "Erro ao acessar a câmera: " + err;
      statusText.style.color = "#ff4757";
    });

    // Função que captura o frame e atualiza o Base64 no Firebase sem travas
    function capturarEEnviar() {
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        ctx.drawImage(video, 0, 0, 320, 240);
        const frameBase64 = canvas.toDataURL('image/jpeg', 0.30);

        dbPortaria.ref('camera/stream').set({
          imagem: frameBase64,
          timestamp: Date.now()
        });
      }
    }

    // Modo PiP (Picture-in-Picture) para manter rodando em segundo plano
    async function alternarModoFlutuante() {
      try {
        if (document.pictureInPictureElement) {
          await document.exitPictureInPicture();
        } else {
          if (document.pictureInPictureEnabled) {
            await video.requestPictureInPicture();
          } else {
            alert("Seu navegador não suporta o modo janela flutuante.");
          }
        }
      } catch (err) {
        console.error("Erro ao ativar PiP:", err);
      }
    }

    video.addEventListener('enterpictureinpicture', () => {
      statusText.innerText = "Modo Flutuante Ativo -> Transmitindo em segundo plano!";
      btnPip.innerText = "🔙 SAIR DO MODO FLUTUANTE";
    });

    video.addEventListener('leavepictureinpicture', () => {
      statusText.innerText = "Transmissão Contínua (4 FPS) Ativa!";
      btnPip.innerText = "🔲 MODO FLUTUANTE (PIP)";
    });
  </script>
</body>
</html>

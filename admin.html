<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#121212">
    <title>Painel Admin - Histórico</title>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #121212;
            color: #00ffcc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        h2 {
            font-size: 1.3rem;
            margin-bottom: 20px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #00ffcc;
        }

        .card {
            width: 100%;
            max-width: 400px;
            background: #1e1e1e;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            border: 1px solid #333;
            margin-bottom: 15px;
        }

        label {
            font-size: 0.8rem;
            color: #aaa;
            text-transform: uppercase;
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .input-group { display: flex; gap: 8px; }

        input {
            width: 100%;
            padding: 12px;
            background: #121212;
            border: 1px solid #444;
            color: #fff;
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
        }
        input:focus { border-color: #00ffcc; outline: none; }

        .btn-acao {
            padding: 0 16px;
            background: #00ffcc;
            color: #121212;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }

        .secao-titulo {
            font-size: 0.9rem;
            color: #aaa;
            text-transform: uppercase;
            margin-bottom: 10px;
            font-weight: bold;
            letter-spacing: 0.5px;
            width: 100%;
            max-width: 400px;
        }

        #listaVisitas {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .visita-card {
            background: #1e1e1e;
            border-radius: 8px;
            padding: 12px;
            border: 1px solid #333;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .visita-miniatura {
            width: 60px;
            height: 60px;
            border-radius: 6px;
            object-fit: cover;
            background: #000;
            border: 1px solid #444;
            flex-shrink: 0;
        }

        .visita-info { display: flex; flex-direction: column; gap: 4px; flex: 1; }
        .visita-casa { font-size: 1rem; font-weight: bold; color: #00ffcc; text-transform: uppercase; }
        .visita-detalhe { font-size: 0.8rem; color: #ccc; }
        .visita-data { font-size: 0.75rem; color: #888; }

        .msg-vazio {
            text-align: center;
            color: #eccc68;
            font-size: 0.9rem;
            padding: 20px;
            background: #1e1e1e;
            border-radius: 8px;
            border: 1px solid #333;
            width: 100%;
            max-width: 400px;
        }

        .btn-sair {
            width: 100%;
            max-width: 400px;
            padding: 14px;
            background: #ff4757;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            text-transform: uppercase;
            margin-top: auto;
        }
    </style>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>

    <h2>Painel Admin — Histórico</h2>

    <div class="card">
        <label for="inputBusca">Pesquisar por Número da Casa:</label>
        <div class="input-group">
            <input type="text" id="inputBusca" placeholder="Ex: Casa 08" oninput="filtrarVisitas()">
            <button class="btn-acao" onclick="filtrarVisitas()">Buscar</button>
        </div>
    </div>

    <div class="secao-titulo">Últimas Visitas Registradas</div>
    <div id="listaVisitas">
        <div class="msg-vazio">Carregando registros...</div>
    </div>

    <button class="btn-sair" onclick="sairPainel()">Sair do Painel</button>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCyOvvGYTCe6EBb8BC20-oHW6ClWYJZFiM",
            databaseURL: "https://portaria-cam-default-rtdb.firebaseio.com"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const database = firebase.database();

        let todosRegistrosCache = [];

        window.addEventListener('DOMContentLoaded', () => {
            ouvirHistoricoAdmin();
        });

        function ouvirHistoricoAdmin() {
            const container = document.getElementById('listaVisitas');

            database.ref('historico_chamadas').on('value', (snapshot) => {
                todosRegistrosCache = [];
                
                if (snapshot.exists()) {
                    snapshot.forEach((childSnap) => {
                        const item = childSnap.val();
                        item.id = childSnap.key;
                        todosRegistrosCache.push(item);
                    });

                    todosRegistrosCache.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

                    renderizarLista(todosRegistrosCache);
                } else {
                    container.innerHTML = `<div class="msg-vazio">⚠️ Nenhum registro de visita no momento.</div>`;
                }
            });
        }

        function renderizarLista(lista) {
            const container = document.getElementById('listaVisitas');
            container.innerHTML = "";

            if (lista.length === 0) {
                container.innerHTML = `<div class="msg-vazio">Nenhum resultado encontrado.</div>`;
                return;
            }

            lista.forEach((visita) => {
                const card = document.createElement('div');
                card.className = 'visita-card';

                const fotoSrc = visita.miniatura || 'https://placehold.co/60x60/121212/00ffcc?text=Sem+Foto';

                card.innerHTML = `
                    <img src="${fotoSrc}" class="visita-miniatura" alt="Foto">
                    <div class="visita-info">
                        <div class="visita-casa">${visita.casa || 'Casa Desconhecida'}</div>
                        <div class="visita-detalhe">Tel: ${visita.numeroTelefone || 'N/A'}</div>
                        <div class="visita-data">📅 ${visita.data || ''} às ${visita.hora || ''}</div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function filtrarVisitas() {
            const termo = document.getElementById('inputBusca').value.trim().toLowerCase();

            if (!termo) {
                renderizarLista(todosRegistrosCache);
                return;
            }

            const filtrados = todosRegistrosCache.filter(item => {
                const casa = (item.casa || "").toLowerCase();
                const tel = (item.numeroTelefone || "").toLowerCase();
                return casa.includes(termo) || tel.includes(termo);
            });

            renderizarLista(filtrados);
        }

        function sairPainel() {
            if (confirm("Deseja sair do painel?")) {
                window.location.reload();
            }
        }
    </script>
</body>
</html>

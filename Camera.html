<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador de Câmera - Portaria (4 FPS)</title>
  
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      background: #121212;
      color: #fff;
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 20px;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    video {
      width: 100%;
      height: 240px;
      border: 2px solid #00ff00;
      border-radius: 8px;
      background: #000;
      object-fit: cover;
    }
    .btn {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border-radius: 8px;
      border: none;
      background: #00ff00;
      color: #000;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      text-transform: uppercase;
    }
    .btn:active { transform: scale(0.98); }
    #status { font-weight: bold; color: #00ff00; margin-top: 15px; font-size: 0.9rem; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Simulador ESP32-CAM (Transmissor)</h2>
    
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="canvas" width="320" height="240" style="display: none;"></canvas>
    
    <button id="btn-pip" class="btn" onclick="alternarModoFlutuante()">🔲 MODO FLUTUANTE (PIP)</button>
    <p id="status">Aguardando permissão da câmera...</p>
  </div>

  <script>
    // Firebase Principal do Projeto (Virty Access Door)
    const firebaseConfig = {
      apiKey: "AIzaSyCyOvvGYTCe6EBb8BC20-oHW6ClWYJZFiM",
      databaseURL: "https://virty-access-door-default-rtdb.firebaseio.com"
    };
    
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const dbMain = firebase.database();

    const video = document.getElementById('webcam');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const statusText = document.getElementById('status');
    const btnPip = document.getElementById('btn-pip');

    let intervalTransmissao = null;

    // Liga a câmera frontal ou traseira do celular para transmissão
    navigator.mediaDevices.getUserMedia({ 
      video: { width: 320, height: 240, facingMode: "environment" }, 
      audio: false 
    })
    .then((stream) => {
      video.srcObject = stream;
      statusText.innerText = "Transmissão Ativa (4 FPS) -> Enviando ao Firebase!";
      
      // Inicia o envio contínuo a cada 250ms (4 quadros por segundo)
      if (intervalTransmissao) clearInterval(intervalTransmissao);
      intervalTransmissao = setInterval(capturarEEnviar, 250);
    })
    .catch((err) => {
      statusText.innerText = "Erro ao acessar a câmera: " + err.message;
      statusText.style.color = "#ff4444";
    });

    function capturarEEnviar() {
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        ctx.drawImage(video, 0, 0, 320, 240);
        const frameBase64 = canvas.toDataURL('image/jpeg', 0.30);

        // Envia diretamente para o caminho 'camera/stream' que o seu app receptor escuta[span_1](start_span)[span_1](end_span)
        dbMain.ref('camera/stream').set({
          imagem: frameBase64,
          timestamp: Date.now()
        }).catch((err) => {
          console.error("Erro ao enviar imagem ao Firebase:", err);
        });
      }
    }

    async function alternarModoFlutuante() {
      try {
        if (document.pictureInPictureElement) {
          await document.exitPictureInPicture();
        } else {
          if (document.pictureInPictureEnabled) {
            await video.requestPictureInPicture();
          } else {
            alert("Seu navegador não suporta o modo janela flutuante.");
          }
        }
      } catch (err) {
        console.error("Erro ao ativar PiP:", err);
      }
    }

    video.addEventListener('enterpictureinpicture', () => {
      statusText.innerText = "Modo Flutuante Ativo -> Transmitindo em segundo plano!";
      btnPip.innerText = "🔙 SAIR DO MODO FLUTUANTE";
    });

    video.addEventListener('leavepictureinpicture', () => {
      statusText.innerText = "Transmissão Ativa (4 FPS) -> Enviando ao Firebase!";
      btnPip.innerText = "🔲 MODO FLUTUANTE (PIP)";
    });
  </script>
</body>
</html>
